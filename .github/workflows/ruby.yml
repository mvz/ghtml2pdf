# This workflow will download a prebuilt Ruby version, install dependencies and
# run tests with Rake
# For more information see: https://github.com/marketplace/actions/setup-ruby-jruby-and-truffleruby

name: CI

"on":
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        ruby: ["3.3", "3.4", "4.0"]

    steps:
      - uses: actions/checkout@v7
      - name: Install non-ruby dependencies
        run: |
          # Needed to avoid packages not being found sometimes
          sudo apt-get update

          # Install the following ependencies:
          #
          # libgirepository-1.0-1 - Provides libgirepository-1.0.so.1
          #
          # gir1.2-gtk-3.0 - Provides Gtk-3.0.typelib
          # gir1.2-atspi-2.0 - Provides Atspi-2.0.typelib
          # gir1.2-poppler-0.18 - Provides Poppler bindings used to check PDF result
          # gir1.2-webkit2-4.1 - GIR data for GtkWebkit 4
          #
          # at-spi2-core - Needed to avoid warnings about retrieving
          #                accessibility bus address
          # libharfbuzz-gobject0 - Missing dependency of gir1.2-harfbuzz-0.0
          #
          # xvfb - Provides xvfb-run used by the headless gem

          sudo apt-get install  --no-install-recommends \
            libgirepository-1.0-1 \
            gir1.2-gtk-3.0 \
            gir1.2-atspi-2.0 \
            gir1.2-poppler-0.18 \
            gir1.2-webkit2-4.1 \
            at-spi2-core \
            libharfbuzz-gobject0 \
            xvfb

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run tests
        run: dbus-run-session bundle exec rake

  rubocop:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Run RuboCop
        run: bundle exec rubocop -P
